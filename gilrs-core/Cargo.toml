[package]
name = "gilrs-core"
version = "0.6.4"
authors = ["Mateusz Sieczko <arvamer@gmail.com>"]
license = "Apache-2.0/MIT"
description = "Minimal event-based abstraction for working with gamepads"
documentation = "https://docs.rs/gilrs-core/"
repository = "https://gitlab.com/gilrs-project/gilrs"
readme = "README.md"
keywords = ["gamepad", "joystick", "input"]
categories = ["game-engines"]
edition = "2021"
rust-version = "1.80.0"

[dependencies]
uuid = "1.0.0"
log = "0.4.1"
serde = { version = "1.0", features = ["derive"], optional = true }


[dev-dependencies]
env_logger = "0.11.5"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd"))'.dependencies]
libudev-sys = "0.1.4"
libc = "0.2"
nix = { version = "0.29.0", default-features = false, features = ["ioctl", "event"] }
vec_map = "0.8"
inotify = { version = "0.11.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.0"
io-kit-sys = "0.4.1"
vec_map = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.4", features = ["xinput"], optional = true }
rusty-xinput = { version = "1.2.0", optional = true }
windows = { version = ">=0.44, <=0.61", optional = true, features = [
    "Gaming_Input",
    "Foundation_Collections",
    "Devices_Power",
    "System_Power",
    "Gaming_Input_ForceFeedback"
] }

# GameController.framework, for the `ios` backend. Declared for **both** Apple
# platforms rather than iOS alone: the `gc-backend` feature runs that same backend
# on macOS so the iPad's input path can be developed against a real pad on a
# desktop, and a `[target.'cfg(...)']` header cannot itself be feature-gated.
# `default-features = false` throughout — `objc2-game-controller`'s default turns
# on all sixty-nine of its classes, and this needs eight.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSDate",
    # `NSObjCRuntime` is the non-obvious one: `NSDefaultRunLoopMode` and
    # `runMode:beforeDate:` are gated on it as well as on `NSDate`/`NSRunLoop`,
    # and without it they silently do not exist.
    "NSObjCRuntime",
    "NSRunLoop",
    "NSEnumerator",
] }
objc2-game-controller = { version = "0.3.2", default-features = false, features = [
    "GCController",
    "GCDevice",
    "GCExtendedGamepad",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerAxisInput",
    "GCControllerElement",
    "GCPhysicalInputProfile",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3" }
web-sys = { version = "0.3", features = [
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    "Window",
    "Navigator",
    "DomException",
] }
wasm-bindgen = "0.2"

[package.metadata.docs.rs]
features = ["serde"]

[features]
default = ["wgi"]
serde-serialize = ["serde"]
xinput = ["rusty-xinput", "winapi"]
wgi = ["windows"]
# Run the GameController (`ios`) backend on macOS instead of the IOKit one, so
# the iPad's input path can be tested on a desktop. Inert on every other target:
# iOS selects that backend regardless, and nothing else can.
gc-backend = []
